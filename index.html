<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Evasion - Robot Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <!-- Main Menu -->
    <div id="menu-screen" class="screen active">
        <h1>NEON EVASION (ROBOT)</h1>
        <!-- Launches directly into Debug difficulty -->
        <button class="main-btn" onclick="startGame('Debug', 'Debug')">ROBOT MODE</button>
        <button class="main-btn" onclick="showScreen('customize-screen')">Customize</button>
        <button class="main-btn" onclick="showScreen('keybinds-screen')">Keybinds</button>
    </div>

    <!-- Customize Screen -->
    <div id="customize-screen" class="screen">
        <h2>SELECT PLAYER COLOR</h2>
        <div style="display: flex; gap: 50px; justify-content: center; flex-wrap: wrap;">
            <!-- Player 1 Palette Only -->
            <div>
                <div class="color-grid" id="p1-color-grid">
                    <div class="color-btn" style="background: #FF0000;" data-color="#FF0000" onclick="setPlayerColor(1, '#FF0000')"></div>
                    <div class="color-btn" style="background: #FF7F00;" data-color="#FF7F00" onclick="setPlayerColor(1, '#FF7F00')"></div>
                    <div class="color-btn" style="background: #FFFF00;" data-color="#FFFF00" onclick="setPlayerColor(1, '#FFFF00')"></div>
                    <div class="color-btn" style="background: #7FFF00;" data-color="#7FFF00" onclick="setPlayerColor(1, '#7FFF00')"></div>
                    <div class="color-btn" style="background: #00FF7F;" data-color="#00FF7F" onclick="setPlayerColor(1, '#00FF7F')"></div>
                    
                    <div class="color-btn" style="background: #00FFFF;" data-color="#00FFFF" onclick="setPlayerColor(1, '#00FFFF')"></div>
                    <div class="color-btn" style="background: #007FFF;" data-color="#007FFF" onclick="setPlayerColor(1, '#007FFF')"></div>
                    <div class="color-btn" style="background: #0000FF;" data-color="#0000FF" onclick="setPlayerColor(1, '#0000FF')"></div>
                    <div class="color-btn" style="background: #7F00FF;" data-color="#7F00FF" onclick="setPlayerColor(1, '#7F00FF')"></div>
                    <div class="color-btn" style="background: #FF00FF;" data-color="#FF00FF" onclick="setPlayerColor(1, '#FF00FF')"></div>
                    
                    <div class="color-btn" style="background: #FF007F;" data-color="#FF007F" onclick="setPlayerColor(1, '#FF007F')"></div>
                    <div class="color-btn" style="background: #FFFFFF;" data-color="#FFFFFF" onclick="setPlayerColor(1, '#FFFFFF')"></div>
                    <div class="color-btn" style="background: #C0C0C0;" data-color="#C0C0C0" onclick="setPlayerColor(1, '#C0C0C0')"></div>
                    <!-- The Gray (#808080) was removed to reserve it for the Robot. Added #00FA9A to keep the grid even -->
                    <div class="color-btn" style="background: #00FA9A;" data-color="#00FA9A" onclick="setPlayerColor(1, '#00FA9A')"></div>
                    <div class="color-btn" style="background: #4B0082;" data-color="#4B0082" onclick="setPlayerColor(1, '#4B0082')"></div>
                </div>
                <p>Color: <span id="p1-color-text" style="color: #00FFFF;">#00FFFF</span></p>
            </div>
        </div>
        <button class="main-btn" onclick="showScreen('menu-screen')">Back</button>
    </div>

    <!-- Keybinds Screen -->
    <div id="keybinds-screen" class="screen">
        <h2>HOW TO PLAY</h2>
        <p><strong>Movement:</strong> Arrow Keys OR WASD</p>
        <p><strong>Dash (Teleport):</strong> Spacebar, /, or Right Shift</p>
        <br>
        <p><strong>P</strong> - Pause Game</p>
        <br>
        <button class="main-btn" onclick="showScreen('menu-screen')">Back</button>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="screen" style="background: rgba(0, 0, 0, 0.95); z-index: 20;">
        <h1>PAUSED</h1>
        <button class="main-btn" onclick="resumeGame()">Resume</button>
        <button class="main-btn" onclick="quitToMenu()">Menu</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen">
        <h1 class="danger-text">SYSTEM FAILURE</h1>
        <p class="stats-text" id="death-stats-mode">Robot Mode</p>
        <p>Time Survived: <span id="survival-time">0</span> seconds</p>
        <br>
        <button class="main-btn" onclick="showScreen('menu-screen')">MAIN MENU</button>
    </div>

    <!-- Victory Screen -->
    <div id="victory-screen" class="screen">
        <h1 class="victory-text" id="victory-title">ROBOT MODE CLEARED</h1>
        <p id="debug-hits-display" style="display:none; color: yellow;">Hits Taken: <span id="final-hits">0</span></p>
        <br>
        <button class="main-btn" onclick="showScreen('menu-screen')">MAIN MENU</button>
    </div>

    <!-- Game Canvas & HUD -->
    <div id="hud">
        <div>Time: <span id="timer-display">0</span> <span id="timer-max"></span></div>
        <div>HP: <span id="hp-display">5</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<script src="game.js"></script>
</body>
</html>
